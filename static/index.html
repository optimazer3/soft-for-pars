<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizer · Сводка по клиентам</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2322c55e'/><circle cx='11' cy='16' r='5' fill='none' stroke='%230b0e14' stroke-width='3'/><circle cx='21' cy='16' r='5' fill='none' stroke='%230b0e14' stroke-width='3'/></svg>">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/dashboard">
      <span class="brand-logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="16" r="5"/><circle cx="21" cy="16" r="5"/></svg>
      </span>
      <span class="brand-text">Optimizer <b>Сводка</b></span>
    </a>

    <nav class="tabs" id="tabs">
      <span class="tabs-indicator" id="tabs-indicator"></span>
      <a class="tab" href="#/dashboard" data-tab="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        <span>Дашборд</span>
      </a>
      <a class="tab" href="#/clients" data-tab="clients">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Клиенты</span>
      </a>
      <a class="tab" href="#/clients/new" data-tab="new">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Добавить</span>
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Настройки</span>
      </a>
    </nav>

    <div class="sync-box">
      <span class="next-run" id="next-run"></span>
      <button class="btn btn-primary sync-btn" id="sync-all">
        <svg class="ico-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M3 21v-5h5"/></svg>
        <span class="sync-label">Обновить всех</span>
        <span class="sync-progress"></span>
      </button>
    </div>
  </header>

  <main class="view" id="view"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
